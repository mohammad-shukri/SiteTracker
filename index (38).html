<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flat Wise Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2733;--mut:#6b7785;--line:#dfe4ea;--pri:#1f5fbf;--pri2:#e8f0fc;--ok:#1e8e4e;--warn:#d98a00;--bad:#c53030;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;min-height:36px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-height:36px;width:100%}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
h2{margin:0 0 10px;font-size:18px} h3{margin:16px 0 8px;font-size:15px}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:16px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:6px 12px;border-radius:8px}
nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
.sp{flex:1}
.who{font-size:12px;color:var(--mut)}
main{padding:12px 14px 90px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.fbar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:12px}
.fbar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ms{position:relative}
.ms>button{display:flex;gap:6px;align-items:center;max-width:190px;overflow:hidden;white-space:nowrap}
.ms>button.act{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.ms .panel{position:absolute;z-index:30;top:40px;left:0;width:270px;max-height:360px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:flex;flex-direction:column}
.ms .panel .top{padding:8px;display:flex;gap:6px;border-bottom:1px solid var(--line)}
.ms .panel .top input{min-width:0}
.ms .panel .list{overflow:auto;padding:4px 0}
.ms .panel label{display:flex;gap:8px;align-items:center;margin:0;padding:6px 10px;font-size:14px;color:var(--ink);cursor:pointer}
.ms .panel label:hover{background:var(--pri2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);background:#fafbfc;position:sticky;top:0}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
tr.r{cursor:pointer} tr.r:hover td{background:var(--pri2)}
.pb{background:#e9edf2;border-radius:6px;height:16px;min-width:70px;position:relative;overflow:hidden}
.pb i{display:block;height:100%;background:var(--pri)} .pb u{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;text-decoration:none}
.bd{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#eef1f5}
.bd.Completed{background:#dff3e7;color:var(--ok)}.bd.Issue{background:#fde2e2;color:var(--bad)}
.bd.InProgress{background:#fff1d6;color:#9a6200}.bd.Waiting{background:#eceff3;color:var(--mut)}.bd.Ready{background:var(--pri2);color:var(--pri)}
small,.mut{color:var(--mut)}
.err{background:#fde8e8;color:#8f1d1d;border:1px solid #f5bcbc;border-radius:8px;padding:8px 10px;margin:8px 0;white-space:pre-wrap}
.okmsg{background:#e3f5ea;color:#17683a;border:1px solid #b7e2c8;border-radius:8px;padding:8px 10px;margin:8px 0}
.warnmsg{background:#fff4dc;color:#7a5200;border:1px solid #f0d89a;border-radius:8px;padding:8px 10px;margin:8px 0}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,30,45,.5)}
dialog form,dialog .dlg{padding:16px;max-height:92vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sel-bar{position:sticky;bottom:8px;z-index:15;background:#1c2733;color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sel-bar button{min-height:34px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#1c2733;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:92vw}
.login{max-width:380px;margin:8vh auto;padding:0 14px}
.mx td,.mx th{padding:4px 6px;text-align:center;font-size:12px;border:1px solid #eef0f3}
.mx{border-collapse:separate;border-spacing:0}
.mxw{max-height:72vh}
.mx thead th{position:sticky;background:#fafbfc;z-index:3}
.mx thead tr:first-child th{top:0;height:26px}
.mx thead tr:nth-child(2) th{top:26px}
.mx thead tr:nth-child(3) th{top:52px}
.mx th.grp{background:#eaf1fb}
.mx .l1,.mx .l2{position:sticky;background:#fff;z-index:2;white-space:nowrap;text-align:left}
.mx .l1{left:0;min-width:150px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.mx .l2{left:150px;min-width:56px;border-right:3px solid #1c2733}
.mx thead th.l1,.mx thead th.l2{z-index:5;background:#fafbfc}
.mx .gi{border-left:3px solid #1c2733}
.mx .ga{border-left:2px solid #8a97a6}
.mx tr.brk td{border-top:2px solid #8a97a6}
.mx td.tot{font-weight:600}
.mx td{white-space:nowrap}
.mx .pcs{opacity:.7;margin-left:4px;font-size:11px}
.lg{display:inline-block;width:14px;height:14px;border:1px solid #bbb;vertical-align:middle;border-radius:3px}
.mx .lu{font-size:10px;opacity:.75;font-style:italic}
.mx .dt{display:block;font-size:11px;white-space:nowrap;line-height:1.25}
.mx tfoot td{position:sticky;bottom:0;background:#fafbfc;z-index:2}
.mx td.c{cursor:pointer}
.hm td{min-width:56px;text-align:center;font-size:12px}
.seg{display:flex;height:18px;border-radius:5px;overflow:hidden;background:#eef1f5;min-width:120px}
.seg i{display:block;height:100%}
.pg{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:4px;align-items:center;background:#eef1f5;border-radius:16px;padding:2px 8px;margin:2px;font-size:12px}
.chip b{cursor:pointer;color:var(--bad)}
.hist{font-size:12px;border-left:3px solid var(--line);padding-left:8px;margin:6px 0}
.mobnav{display:none}
@media (max-width:760px){
 main{padding:8px 8px 96px} header{padding:6px 8px} .who{display:none}
 nav{display:none}
 .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:25;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 .mobnav button{flex:1;border:0;background:transparent;font-size:11px;padding:6px 2px;min-height:44px}
 .mobnav button.on{color:var(--pri);font-weight:700;background:var(--pri2)}
 .fbar .row.fold{display:none} .fbar.open .row.fold{display:flex}
 .ms .panel{position:fixed;left:8px;right:8px;top:auto;bottom:70px;width:auto;max-height:60vh}
 .ms>button{max-width:none}
 .g2{grid-template-columns:1fr}
 table.cards thead{display:none}
 table.cards,table.cards tbody{display:block}
 table.cards tr{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 8px;background:#fff;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:8px}
 table.cards td{border:0;padding:2px 0;display:block}
 table.cards td[data-l]::before{content:attr(data-l);display:block;font-size:10px;color:var(--mut);text-transform:uppercase}
 table.cards td.full{grid-column:1/-1}
 .tw.cardwrap{border:0;background:transparent;max-height:none}
 dialog{width:100vw;max-height:100vh;height:100vh;border-radius:0} dialog form,dialog .dlg{max-height:100vh;height:100%}
 button,input,select{min-height:42px}
}
@media (min-width:761px){table.cards td.full{}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hide"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ============ CONFIG: paste your Supabase project URL and PUBLISHABLE (anon) key ============ */
const CFG = { url: 'https://fzpftrhgmaqgdsrteacg.supabase.co', key: 'sb_publishable_k8gA1UKeO2ZqXtJaKsuQpQ_y4fWQqNC' };
/* (never put the secret / service_role key here) */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const num = v => (v === null || v === undefined || v === '' ? null : Number(v));
const fmt = (v, d = 1) => v === null || v === undefined ? '' : Number(v).toLocaleString(undefined, { maximumFractionDigits: d });
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
let sb, ME = null, PROFILE = null, META = {}, PROFILES = {}, MYTRADES = {};
const PAGE = 50;
function multiB(projName) { const p = META.projects.find(x => x.name === projName); if (!p) return true; return new Set(META.locations.filter(l => l.project_id === p.id).map(l => l.building)).size > 1; }
/* working days between two dates (inclusive), skipping the weekend days set in app_settings (0=Sun … 6=Sat) */
function workDays(a, b) {
  if (!a) return null; const we = new Set(String(SETTINGS.weekend_days ?? '0').split(',').filter(x => x !== '').map(Number));
  let d = new Date(a + 'T00:00:00Z'); const e = new Date((b || today()) + 'T00:00:00Z'); let n = 0;
  if (e < d) return 0; for (; d <= e; d = new Date(d.getTime() + 864e5)) if (!we.has(d.getUTCDay())) n++; return n;
}
const levelLabel = l => /^\d+$/.test(String(l)) ? String(+l) : l;                       // 03 -> 3 (B01, GF unchanged)
const flatLabel = (lv, loc) => /^\d+$/.test(String(lv)) && /^\d+$/.test(String(loc)) ? String(+lv) + String(loc).padStart(2, '0') : levelLabel(lv) + ' · ' + loc;   // level 03, apartment 03 -> 303
const locLabel = r => (multiB(r.plot_name) ? r.building + ' · ' : '') + flatLabel(r.level, r.location);

function toast(m, ms = 3500) { const t = $('#toast'); t.textContent = m; t.classList.remove('hide'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hide'), ms); }
function errText(e) { return (e && (e.message || e.details || e.hint)) ? e.message || e.details : String(e); }

/* ================= CSV ================= */
const COLLABEL = { installed_qty: 'completed_qty' };
function toCSV(rows, cols) {
  const q = v => { v = v ?? ''; v = String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [cols.map(c => COLLABEL[c] || c).join(',')].concat(rows.map(r => cols.map(c => q(r[c])).join(','))).join('\r\n');
}
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function parseCSV(t) {
  t = t.replace(/^﻿/, ''); const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(x => x.trim() !== '')).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}

/* ================= start-up / login ================= */
function init() {
  const url = localStorage.fw_url || CFG.url, key = localStorage.fw_key || CFG.key;
  if (!/^https?:\/\//.test(url) || /^YOUR_/.test(key)) return showConfig();
  sb = supabase.createClient(url, key);
  sb.auth.getSession().then(({ data }) => data.session ? start(data.session.user) : showLogin());
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') showLogin(); });
}
function showConfig() {
  $('#app').innerHTML = `<div class="login card"><h2>Connect to Supabase</h2>
  <p class="mut">Supabase → Project Settings → API. Use the <b>Project URL</b> and the <b>publishable (anon)</b> key. Never the secret key.</p>
  <label>Project URL</label><input id="cu" placeholder="https://xxxx.supabase.co">
  <label>Publishable key</label><input id="ck" placeholder="sb_publishable_... or eyJ...">
  <p><button class="pri" id="cs">Save and continue</button></p></div>`;
  $('#cs').onclick = () => { localStorage.fw_url = $('#cu').value.trim(); localStorage.fw_key = $('#ck').value.trim(); init(); };
}
function showPending(user) {
  $('#app').innerHTML = `<div class="login card"><h2>Waiting for approval</h2>
  <p>Your account <b>${esc(user.email)}</b> has been created, but an admin has not approved it yet.</p>
  <p class="mut">Ask your admin to approve it, then press the button below.</p>
  <p class="bar"><button class="pri" id="pr">Check again</button><button id="lo">Sign out</button></p></div>`;
  $('#pr').onclick = () => start(user); $('#lo').onclick = () => sb.auth.signOut();
}
function showLogin(msg) {
  $('#app').innerHTML = `<div class="login card"><h2>Flat Wise Tracker</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div id="lerr"></div>
  <p class="bar"><button class="pri" id="si">Sign in</button><button id="su">Create account</button></p>
  <p class="mut">New accounts must be approved by an admin before they can sign in to the data.</p>
  <p><small><a href="#" id="rc">Change Supabase connection</a></small></p></div>`;
  if (msg) $('#lerr').innerHTML = `<div class="okmsg">${esc(msg)}</div>`;
  const go = async signup => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    const r = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
    if (r.error) return $('#lerr').innerHTML = `<div class="err">${esc(r.error.message)}</div>`;
    if (!r.data.session) return $('#lerr').innerHTML = `<div class="okmsg">Account created. Confirm your email if asked, then sign in. An admin must approve your account before you can see any data.</div>`;
    start(r.data.user);
  };
  $('#si').onclick = () => go(false); $('#su').onclick = () => go(true);
  $('#pw').onkeydown = e => { if (e.key === 'Enter') go(false); };
  $('#rc').onclick = e => { e.preventDefault(); delete localStorage.fw_url; delete localStorage.fw_key; showConfig(); };
}

async function start(user) {
  ME = user;
  $('#app').innerHTML = '<div class="login"><p class="mut">Loading…</p></div>';
  try {
    const me = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (me.error) throw me.error;
    if (!me.data?.approved) return showPending(user);
    const [pr, ut, pf, st, projects, trades, steps, acts, locs] = await Promise.all([
      Promise.resolve(me),
      sb.from('user_trades').select('*').eq('user_id', user.id),
      sb.from('profiles').select('id,full_name,email,role,approved'),
      sb.from('app_settings').select('*'),
      sb.from('projects').select('*').order('name'),
      sb.from('trades').select('*').order('name'),
      sb.from('steps').select('*').order('sort_order'),
      sb.from('activities').select('id,code,description,uom,weight_in_item,sort_order,item:items(id,code,trade:trades(id,name))').order('code'),
      fetchAll(() => sb.from('locations').select('id,project_id,building,level,location,unit_type').order('id'))
    ]);
    for (const r of [pr, ut, pf, st, projects, trades, steps, acts]) if (r.error) throw r.error;
    SETTINGS = Object.fromEntries((st.data || []).map(x => [x.key, x.value]));
    PROFILE = pr.data || { role: 'viewer' };
    MYTRADES = Object.fromEntries((ut.data || []).map(x => [x.trade_id, x]));
    PROFILES = Object.fromEntries((pf.data || []).map(x => [x.id, x]));
    META = { projects: projects.data, trades: trades.data, steps: steps.data, locations: locs,
      activities: acts.data.filter(a => canViewTrade(a.item?.trade?.id)).map(a => ({ id: a.id, code: a.code, description: a.description, uom: a.uom, w: Number(a.weight_in_item ?? 1), ord: Number(a.sort_order || 0), trade: a.item?.trade?.name, item: a.item?.code, item_id: a.item?.id })) };
  } catch (e) {
    $('#app').innerHTML = `<div class="login card"><h2>Could not load</h2><div class="err">${esc(errText(e))}</div>
    <p class="mut">If it says a table does not exist, run the SQL files in order (00_reset, 01_schema, 02_seed, 03_marble_quantities).</p><button id="lo">Sign out</button></div>`;
    $('#lo').onclick = () => sb.auth.signOut(); return;
  }
  shell(); loadLA();
}
let SETTINGS = {};
const bulkMax = () => +SETTINGS.bulk_max_steps || 300;
const isAdmin = () => PROFILE.role === 'admin';
const canViewTrade = id => isAdmin() || !!(MYTRADES[id] && (MYTRADES[id].can_view || MYTRADES[id].can_edit || MYTRADES[id].can_approve));
const canEditTrade = id => isAdmin() || (PROFILE.role === 'editor' && !!MYTRADES[id]?.can_edit);
const canApproveTrade = id => isAdmin() || !!MYTRADES[id]?.can_approve;

/* ================= shell and tabs ================= */
const TABS = [['tracker', 'Tracker'], ['matrix', 'Matrix'], ['io', 'Import / Export'], ['setup', 'Setup']];
let TAB = 'tracker';
function shell() {
  const tabs = TABS.filter(t => !['setup', 'io'].includes(t[0]) || isAdmin());
  $('#app').innerHTML = `<header><span class="brand">🏗 Flat Wise Tracker</span><nav>${tabs.map(t => `<button data-t="${t[0]}">${t[1]}</button>`).join('')}</nav><span class="sp"></span>
  <span class="who">${esc(PROFILE.full_name || ME.email)} · ${esc(PROFILE.role)}</span><button id="lo">Sign out</button></header>
  <div class="mobnav">${tabs.map(t => `<button data-t="${t[0]}">${t[1].split(' ')[0]}</button>`).join('')}</div>
  <main><div id="fb"></div><div id="view"></div></main>`;
  $$('[data-t]').forEach(b => b.onclick = () => setTab(b.dataset.t));
  $('#lo').onclick = () => sb.auth.signOut();
  renderFilters(); setTab('tracker');
}
function setTab(t) {
  TAB = t; if (t === 'matrix') MXGO = false; $$('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#fb').classList.toggle('hide', t === 'io' || t === 'setup');
  refresh();
}
let rt; function refresh(delay = 0) { clearTimeout(rt); rt = setTimeout(() => ({ dash: renderDash, tracker: renderTracker, matrix: renderMatrix, io: renderIO, setup: renderSetup }[TAB])(), delay); }

/* ================= filters (multi-select) ================= */
const FILTERS = [
  { k: 'project', label: 'Project', col: 'plot_name' }, { k: 'trade', label: 'Trade', col: 'trade' },
  { k: 'activity', label: 'Activity', col: 'activity' }, { k: 'step', label: 'Step', col: 'step_code' },
  { k: 'building', label: 'Building', col: 'building' }, { k: 'level', label: 'Level', col: 'level' },
  { k: 'location', label: 'Flat / Location', col: 'location' },
  { k: 'unit', label: 'Type (CA, 1BR…)', col: 'unit_type' }];
const VIEWKEYS = {
  v_tracker: ['project', 'trade', 'activity', 'step', 'building', 'level', 'location', 'unit'],
  v_flat_activity: ['project', 'trade', 'activity', 'building', 'level', 'location', 'unit'],
  v_activity_summary: ['project', 'trade', 'activity', 'building'],
  v_step_summary: ['project', 'trade', 'activity', 'step', 'building'],
  v_level_progress: ['project', 'trade', 'building', 'level'],
  v_last_update: ['project', 'trade', 'building'],
  v_matrix: ['project', 'trade', 'activity', 'building', 'level', 'location', 'unit']
};
const F = Object.fromEntries(FILTERS.map(f => [f.k, new Set()])); let READY = false, RESP = '';
/* Locations that match the other selected filters (project, building, level, trade/activity).
   `skip` leaves out the filter of the list being opened, so its own choices stay visible. */
function selActIds() {

async function fetchByIdRange(mk, cap = 30000, width = 1000, W = 6) {

    return r.data;

    const res = await Promise.all(jobs); let short = false;

}

/* ---- bulk update ---- */
function chunkIds() {
  const items = [...SEL.entries()].map(([id, v]) => ({ id, ...v })).sort((a, b) => a.la - b.la || a.ord - b.ord);
  const chunks = []; let cur = [], lastLa = null;
  for (const it of items) { if (cur.length >= 300 && it.la !== lastLa) { chunks.push(cur); cur = []; } cur.push(it.id); lastLa = it.la; }
  if (cur.length) chunks.push(cur); return chunks;
}

  else (async () => {

    const u = k => [...new Set(q.data.map(r => r[k]))].sort(natural), L = (k, n = 12) => { const a = u(k); return esc(a.slice(0, n).join(', ')) + (a.length > n ? ` … (+${a.length - n})` : ''); };

    let up = 0, sk = [], done = 0; const chunks = chunkIds();
    try {
      for (const ids of chunks) {
        const upd = ids.map(id => ({ id, changes: c }));
        const { data, error } = corr
          ? await sb.rpc('admin_correct_steps', { p_updates: upd, p_reason: reason, p_dry_run: dry })

}

async function importSteps(file) {
  const out = $('#im'); out.innerHTML = '<p class="mut">Reading…</p>';
  try {
    const rows = parseCSV(await file.text()); if (!rows.length) throw new Error('The file has no data rows.');
    const acts = [...new Set(rows.map(r => r.activity).filter(Boolean))];
    const idx = new Map();
    const found = await fetchAll(() => sb.from('v_tracker').select('id,plot_name,building,level,location,activity,step_code').in('activity', acts).order('id'), 50000);
    const key = (p, b, l, x, a, s) => [p, b, l, x, a, s].map(v => String(v ?? '').trim().toLowerCase()).join('|');
    found.forEach(r => { idx.set(key(r.plot_name, r.building, r.level, r.location, r.activity, r.step_code), r.id); if (!idx.has(key('', r.building, r.level, r.location, r.activity, r.step_code))) idx.set(key('', r.building, r.level, r.location, r.activity, r.step_code), r.id); });
    const ups = [], bad = [];
    rows.forEach((r, i) => {
      const id = idx.get(key(r.project, r.building, r.level, r.location, r.activity, r.step));
      if (!id) return bad.push(`Row ${i + 2}: no match for ${r.building}/${r.level}/${r.location} ${r.activity} ${r.step}`);
      const c = {};
      for (const n of IMPORT_COLS.slice(6)) { const v = (r[n] ?? '').trim(); if (v === '') continue; c[n] = n === 'pct' ? Number(v) : (v.toUpperCase() === 'NULL' ? '' : v); }
      if (!Object.keys(c).length) return; if (c.pct !== undefined && !isFinite(c.pct)) return bad.push(`Row ${i + 2}: pct is not a number`);
      ups.push({ id, changes: c });
    });
    const ordered = ups; // the database sorts each call by flat and step order
    const chunks = []; for (let i = 0; i < ordered.length; i += 300) chunks.push(ordered.slice(i, i + 300));
    // keep a flat's steps in the same chunk: sort by id (ids are grouped by flat) before chunking
    const run = async dry => {
      let up = 0, sk = []; out.querySelectorAll('button').forEach(b => b.disabled = true);
      try { for (const ch of chunks) { const { data, error } = await sb.rpc('apply_step_updates', { p_updates: ch, p_note: 'CSV import: ' + file.name, p_dry_run: dry }); if (error) throw error; up += data.updated; sk = sk.concat(data.skipped); }
        show(dry, up, sk); if (!dry) toast(up + ' rows updated'); } catch (e) { out.insertAdjacentHTML('beforeend', `<div class="err">${esc(errText(e))}</div>`); }
      out.querySelectorAll('button').forEach(b => b.disabled = false);
    };
    const show = (dry, up, sk) => {
      out.innerHTML = `<div class="${bad.length || sk.length ? 'warnmsg' : 'okmsg'}"><b>${dry ? 'Preview: ' + up + ' would update' : up + ' updated'}</b> · ${sk.length} rejected by rules · ${bad.length} not matched · ${rows.length} rows in file</div>
      ${bad.length || sk.length ? `<div class="tw" style="max-height:240px"><table><tbody>${bad.slice(0, 100).map(b => `<tr><td colspan=2>${esc(b)}</td></tr>`).join('')}${sk.slice(0, 200).map(x => `<tr><td>${esc(x.label || x.id)}</td><td>${esc(x.message)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${dry ? '<div class="bar" style="margin-top:8px"><button class="pri" id="iap">Apply import</button></div>' : ''}`;
      if (dry) $('#iap').onclick = () => run(false);
    };
    if (!ups.length) { out.innerHTML = `<div class="warnmsg">Nothing to apply. ${bad.length} rows were not matched.<br>${esc(bad.slice(0, 5).join('\n'))}</div>`; return; }
    ups.sort((a, b) => a.id - b.id); chunks.length = 0; for (let i = 0; i < ups.length; i += 300) chunks.push(ups.slice(i, i + 300));
    run(true);
  } catch (e) { out.innerHTML = `<div class="err">${esc(errText(e))}</div>`; }
}
async function importQty(file) {
  const out = $('#qm'); out.innerHTML = '<p class="mut">Reading…</p>';
  try {
    const rows = parseCSV(await file.text()); if (!rows.length) throw new Error('No data rows.');
    const P = Object.fromEntries(META.projects.map(p => [p.name.toLowerCase(), p.id])), A = Object.fromEntries(META.activities.map(a => [a.code.toLowerCase(), a.id]));
    const L = new Map(META.locations.map(l => [[l.project_id, l.building, l.level, l.location].join('|').toLowerCase(), l.id]));
    const ups = [], bad = [];
    rows.forEach((r, i) => {
      const pid = P[(r.project || '').toLowerCase()] || (META.projects.length === 1 ? META.projects[0].id : null), aid = A[(r.activity || '').toLowerCase()];
      const lid = L.get([pid, r.building, r.level, r.location].join('|').toLowerCase()), q = Number(r.total_qty);
      if (!lid || !aid || !isFinite(q) || q < 0) return bad.push(`Row ${i + 2}: ${!lid ? 'location' : !aid ? 'activity' : 'quantity'} not recognised`);
      ups.push({ location_id: lid, activity_id: aid, total_qty: q });
    });
    let n = 0;
    for (let i = 0; i < ups.length; i += 400) { const { error } = await sb.from('location_activities').upsert(ups.slice(i, i + 400), { onConflict: 'location_id,activity_id' }); if (error) throw error; n += Math.min(400, ups.length - i); }
    out.innerHTML = `<div class="${bad.length ? 'warnmsg' : 'okmsg'}">${n} quantities saved · ${bad.length} rows not recognised.${bad.length ? '<br>' + esc(bad.slice(0, 10).join('\n')) : ''}</div>`;
  } catch (e) { out.innerHTML = `<div class="err">${esc(errText(e))}</div>`; }
}

    $$('[data-add]', el).forEach(b => b.onclick = async () => {
      const id = b.dataset.add, pa = $(`[data-pa="${id}"]`).value; if (!pa) return;
      const { error } = await sb.from('activity_step_predecessors').insert({ activity_step_id: +id, predecessor_id: +pa, link_type: $(`[data-lt="${id}"]`).value, enforcement: $(`[data-en="${id}"]`).value });
      error ? msg(errText(error)) : loadAS();
    });
  } catch (e) { el.innerHTML = `<div class="err">${esc(errText(e))}</div>`; }
}
function setupNew() {
  const el = $('#sn');
  el.innerHTML = `<h3>New project</h3><div class="bar"><input id="np" placeholder="Project name" style="max-width:260px"><button id="npb">Add project</button></div>
  <h3>New location (flat / common area)</h3><div class="g2"><div><label>Project</label><select id="lp">${META.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Building <small>(leave blank if the project has one building)</small></label><input id="lb"></div>
   <div><label>Level</label><input id="ll"></div><div><label>Flat / Location</label><input id="lf"></div><div><label>Type (1BR, 2BR, CA…)</label><input id="lt"></div></div><p><button id="lbb">Add location</button></p>
  <h3>New activity</h3><div class="g2"><div><label>Code</label><input id="ac"></div>
   <div><label>Item</label><select id="ai">${[...new Map(META.activities.map(a => [a.item_id, a.item])).entries()].map(([id, c]) => `<option value="${id}">${esc(c)}</option>`).join('')}</select></div>
   <div><label>Unit</label><select id="au"><option>Sqm</option><option>LM</option><option>Pcs</option></select></div></div><p><button id="aab">Add activity</button> <small>Then give it steps in the section above.</small></p><div id="nm"></div>`;
  const msg = (t, ok) => $('#nm').innerHTML = `<div class="${ok ? 'okmsg' : 'err'}">${esc(t)}</div>`;
  const reload = async () => { await start(ME); setTab('setup'); };
  $('#npb').onclick = async () => { const n = $('#np').value.trim(); if (!n) return; const { error } = await sb.from('projects').insert({ name: n }); error ? msg(errText(error)) : reload(); };
  $('#lbb').onclick = async () => { const { error } = await sb.from('locations').insert({ project_id: +$('#lp').value, building: $('#lb').value.trim() || 'Main', level: $('#ll').value.trim(), location: $('#lf').value.trim(), unit_type: $('#lt').value.trim() || null }); error ? msg(errText(error)) : msg('Location added', true); };
  $('#aab').onclick = async () => { const { error } = await sb.from('activities').insert({ code: $('#ac').value.trim(), item_id: +$('#ai').value, uom: $('#au').value }); error ? msg(errText(error)) : reload(); };
}

init();
</script>
</body>
